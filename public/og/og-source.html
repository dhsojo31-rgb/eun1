<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; font-family: Pretendard, "Malgun Gothic", sans-serif; }
  .bg { position: absolute; inset: 0; }
  .card {
    position: absolute; left: 70px; top: 90px; width: 640px; height: 450px;
    background: rgba(255,255,255,.94); border-radius: 36px; padding: 48px 52px; box-sizing: border-box;
    box-shadow: 0 30px 80px rgba(28,25,23,.22);
  }
  .eyebrow { font-size: 20px; font-weight: 800; letter-spacing: .25em; color: #0f766e; }
  h1 { margin: 14px 0 0; font-size: 64px; line-height: 1.15; font-weight: 900; color: #1c1917; letter-spacing: -1px; }
  .sub { margin-top: 18px; font-size: 26px; font-weight: 600; color: #44403c; }
  .tags { margin-top: 28px; display: flex; gap: 10px; flex-wrap: wrap; }
  .tag { font-size: 18px; font-weight: 700; color: #115e59; background: #ccfbf1; border-radius: 999px; padding: 8px 16px; }
  .foot { position: absolute; left: 52px; bottom: 36px; font-size: 18px; color: #78716c; font-weight: 600; }
  .figure { position: absolute; right: 30px; bottom: -70px; width: 430px; }
  .bubble {
    position: absolute; right: 50px; top: 34px; width: 440px; box-sizing: border-box; background: #fff; border-radius: 28px 28px 6px 28px;
    padding: 18px 24px; font-size: 23px; font-weight: 700; color: #1c1917; box-shadow: 0 20px 50px rgba(0,0,0,.18); z-index: 2;
    word-break: keep-all; line-height: 1.45;
  }
  .bubble small { display: block; font-size: 15px; color: #0f766e; font-weight: 800; margin-bottom: 6px; }
</style>
</head>

      <g stroke="#c99a5b" transform="translate(60 240)"><rect width="26" height="18" rx="7"/><rect x="34" width="26" height="18" rx="7"/><path d="M26 7q4-4 8 0"/></g>
      <g stroke="#1f3a5f" transform="translate(150 240)"><rect width="26" height="18" rx="7"/><rect x="34" width="26" height="18" rx="7"/><path d="M26 7q4-4 8 0"/></g>
      <g stroke="#8c8c8c" transform="translate(240 240)"><rect width="26" height="18" rx="7"/><rect x="34" width="26" height="18" rx="7"/><path d="M26 7q4-4 8 0"/></g>
      <g stroke="#5a3e36" transform="translate(60 330)"><rect width="26" height="18" rx="7"/><rect x="34" width="26" height="18" rx="7"/><path d="M26 7q4-4 8 0"/></g>
      <g stroke="#2b2b2b" transform="translate(150 330)"><rect width="26" height="18" rx="7"/><rect x="34" width="26" height="18" rx="7"/><path d="M26 7q4-4 8 0"/></g>

    </g>
    <rect x="55" y="178" width="270" height="7" rx="3" fill="#d9cfc2"/><rect x="55" y="268" width="270" height="7" rx="3" fill="#d9cfc2"/><rect x="55" y="358" width="270" height="7" rx="3" fill="#d9cfc2"/>
  </g>
  <rect x="860" y="90" width="300" height="230" rx="12" fill="url(#win)" stroke="#d9d0c3" stroke-width="7"/>
  <line x1="1010" y1="93" x2="1010" y2="317" stroke="#d9d0c3" stroke-width="7"/><line x1="863" y1="205" x2="1157" y2="205" stroke="#d9d0c3" stroke-width="7"/>
  <circle cx="1090" cy="150" r="26" fill="#fff4c2"/>
  <path d="M863 290 Q940 230 1010 275 T1157 265 L1157 317 L863 317Z" fill="#cfe6d2"/>
  <ellipse cx="200" cy="80" rx="120" ry="45" fill="#fff6d6" opacity=".8"/>
  <ellipse cx="900" cy="80" rx="120" ry="45" fill="#fff6d6" opacity=".8"/>
</svg>

<div class="card">

</body>
